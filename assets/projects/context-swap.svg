<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" width="480" height="180" role="img" aria-label="context-swap">
<rect x=".5" y=".5" width="479" height="179" rx="12" fill="#10191A" stroke="#22332C"/>
<rect x="0" y="22" width="5" height="40" rx="2.5" fill="#3FCF9F"/>
<text x="34" y="52" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#E6EFE9">context-swap</text>
<text x="34" y="80" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9BB0A4">Replaces a photo background with a solid colour and</text>
<text x="34" y="100" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9BB0A4">keeps the cast shadow, rendered in the new colour.</text>
<text x="34" y="120" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9BB0A4">BiRefNet segmentation, Streamlit app and CLI.</text>
