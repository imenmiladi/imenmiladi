<text x="70.5" y="154" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#3FCF9F">BiRefNet</text>
<rect x="115" y="138" width="80" height="24" rx="12" fill="#0F2A21" stroke="#22332C"/>
<text x="155" y="154" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#3FCF9F">Streamlit</text>
<rect x="203" y="138" width="80" height="24" rx="12" fill="#0F2A21" stroke="#22332C"/>
<text x="243" y="154" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#3FCF9F">pymatting</text>
<rect x="291" y="138" width="88" height="24" rx="12" fill="#0F2A21" stroke="#22332C"/>
<text x="335" y="154" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#3FCF9F">shadow map</text>
</svg>